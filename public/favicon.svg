<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -0.5 13 12" shape-rendering="crispEdges">
  <!-- dark bg -->
  <rect x="-0.5" y="-0.5" width="13" height="12" rx="1.5" ry="1.5" fill="#0d0d14"/>

  <!-- Row 0: ear tips at col 3,4 and col 9,10 -->
  <rect x="2" y="0" width="2" height="1" fill="#1a1a1a"/>
  <rect x="8" y="0" width="2" height="1" fill="#1a1a1a"/>

  <!-- Row 1: ears wider -->
  <rect x="1" y="1" width="4" height="1" fill="#1a1a1a"/>
  <rect x="7" y="1" width="4" height="1" fill="#1a1a1a"/>

  <!-- Row 2: ear with cream inner -->
  <rect x="0" y="2" width="1" height="1" fill="#1a1a1a"/>
  <rect x="1" y="2" width="2" height="1" fill="#e8920a"/>
  <rect x="3" y="2" width="1" height="1" fill="#ffc8a0"/>
  <rect x="4" y="2" width="1" height="1" fill="#1a1a1a"/>
  <rect x="7" y="2" width="1" height="1" fill="#1a1a1a"/>
  <rect x="8" y="2" width="1" height="1" fill="#ffc8a0"/>
  <rect x="9" y="2" width="2" height="1" fill="#e8920a"/>
  <rect x="11" y="2" width="1" height="1" fill="#1a1a1a"/>

  <!-- Row 3: head top — full width outline -->
  <rect x="-0.5" y="3" width="1" height="1" fill="#1a1a1a"/>
  <rect x="0" y="3" width="11" height="1" fill="#e8920a"/>
  <rect x="11" y="3" width="1" height="1" fill="#1a1a1a"/>

  <!-- Row 4: forehead M-stripes -->
  <rect x="-0.5" y="4" width="1" height="1" fill="#1a1a1a"/>
  <rect x="0" y="4" width="2" height="1" fill="#e8920a"/>
  <rect x="2" y="4" width="1" height="1" fill="#b06000"/>
  <rect x="3" y="4" width="1" height="1" fill="#e8920a"/>
  <rect x="4" y="4" width="1" height="1" fill="#b06000"/>
  <rect x="5" y="4" width="2" height="1" fill="#e8920a"/>
  <rect x="7" y="4" width="1" height="1" fill="#b06000"/>
  <rect x="8" y="4" width="1" height="1" fill="#e8920a"/>
  <rect x="9" y="4" width="1" height="1" fill="#b06000"/>
  <rect x="10" y="4" width="1" height="1" fill="#e8920a"/>
  <rect x="11" y="4" width="1" height="1" fill="#1a1a1a"/>

  <!-- Row 5: eyes (sparkle + 2×1 black) -->
  <rect x="-0.5" y="5" width="1" height="1" fill="#1a1a1a"/>
  <rect x="0" y="5" width="2" height="1" fill="#e8920a"/>
  <rect x="2" y="5" width="1" height="1" fill="#ffffff"/><!-- left sparkle -->
  <rect x="3" y="5" width="2" height="1" fill="#1a1a1a"/><!-- left eye -->
  <rect x="5" y="5" width="3" height="1" fill="#e8920a"/>
  <rect x="8" y="5" width="2" height="1" fill="#1a1a1a"/><!-- right eye -->
  <rect x="10" y="5" width="1" height="1" fill="#ffffff"/><!-- right sparkle -->
  <rect x="11" y="5" width="1" height="1" fill="#1a1a1a"/>

  <!-- Row 6: nose + muzzle start -->
  <rect x="-0.5" y="6" width="1" height="1" fill="#1a1a1a"/>
  <rect x="0" y="6" width="5" height="1" fill="#e8920a"/>
  <rect x="5" y="6" width="2" height="1" fill="#f0a0b0"/><!-- pink nose -->
  <rect x="7" y="6" width="4" height="1" fill="#e8920a"/>
  <rect x="11" y="6" width="1" height="1" fill="#1a1a1a"/>

  <!-- Row 7: white muzzle -->
  <rect x="-0.5" y="7" width="1" height="1" fill="#1a1a1a"/>
  <rect x="0" y="7" width="1" height="1" fill="#e8920a"/>
  <rect x="1" y="7" width="9" height="1" fill="#ffffff"/><!-- white muzzle -->
  <rect x="10" y="7" width="1" height="1" fill="#e8920a"/>
  <rect x="11" y="7" width="1" height="1" fill="#1a1a1a"/>

  <!-- Row 8: orange chin (breaks muzzle from chest) -->
  <rect x="0" y="8" width="1" height="1" fill="#1a1a1a"/>
  <rect x="1" y="8" width="9" height="1" fill="#e8920a"/>
  <rect x="10" y="8" width="1" height="1" fill="#1a1a1a"/>

  <!-- Row 9: chest bib -->
  <rect x="0" y="9" width="1" height="1" fill="#1a1a1a"/>
  <rect x="1" y="9" width="1" height="1" fill="#e8920a"/>
  <rect x="2" y="9" width="6" height="1" fill="#ffffff"/><!-- white bib -->
  <rect x="8" y="9" width="2" height="1" fill="#e8920a"/>
  <rect x="10" y="9" width="1" height="1" fill="#1a1a1a"/>
</svg>
